name: Deploy

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    runs-on: [self-hosted, linux, laravel]

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'storage' \
            --exclude 'public/build' \
            --exclude 'bootstrap/cache' \
            "$GITHUB_WORKSPACE/" \
            /home/fazley/apps/nirst/

      - name: Install PHP deps
        run: docker exec nirst_app composer install --no-dev --optimize-autoloader

      - name: Deploy & restart
        run: |
          cd /home/fazley/apps/nirst
          docker compose -f docker-compose.prod.yml up -d --no-deps --build app

      - name: Post-deploy
        run: |
          docker exec nirst_app php artisan migrate --force
          docker exec nirst_app php artisan optimize:clear
          docker exec nirst_app php artisan config:cache
          docker exec nirst_app php artisan view:cache

      - name: Health check
        run: |
          docker ps --filter name=nirst_app --format "{{.Names}} {{.Status}}"
          curl -s -o /dev/null -w "%{http_code}\n" http://localhost/ -H "Host: nirst.fazleyrabbi.xyz"
