services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirst_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8086}:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nirst

  mysql:
    image: mysql:8.0
    container_name: nirst_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nirst}
      MYSQL_USER: ${DB_USERNAME:-nirst_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nirst_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-nirst_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-nirst_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nirst

  redis:
    image: redis:7-alpine
    container_name: nirst_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - nirst

volumes:
  mysql_data:
  redis_data:

networks:
  nirst:
    driver: bridge
